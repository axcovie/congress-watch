[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-watch"
version = "0.1.0"
description = "Post-midterm tracker for the incoming U.S. Congress, built on Telem monitors"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6", "markdown>=3.5"]

[project.optional-dependencies]
webhook = ["telem-sdk"]
dev = ["pytest>=8"]

[project.scripts]
congress-watch = "congress_watch.cli:main"

[tool.setuptools]
packages = ["congress_watch"]
